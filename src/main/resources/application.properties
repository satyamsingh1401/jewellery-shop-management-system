spring.application.name=jewellery-shop-management-system

# Secrets (DB password, dev login) are NOT stored here.
# Put them in src/main/resources/application-local.properties,
# which is listed in .gitignore and must never be committed.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/Jewellery_Shop
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update