# Opt-in integration checks against a separate, disposable local MySQL schema.
# Credentials come from the normal private local configuration/environment.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/${jms.mysql.database}?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
security.jwt.secret=dGVzdC1vbmx5LWptcy1zaWduaW5nLWtleS0zMi1ieXRlcy1taW5pbXVt
security.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:3000
INITIAL_ADMIN_NAME=Test Admin
INITIAL_ADMIN_EMAIL=admin@example.test
INITIAL_ADMIN_PASSWORD=Test-only-password-123
