$kind: http-request
name: "Reject overpayment"
order: 12000
method: POST
url: "{{base_url}}/api/payments"
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{staff_token}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "orderId": {{order_id}},
      "amount": 759,
      "paymentMethod": "UPI"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 400", () => pm.response.to.have.status(400));
      const data = pm.response.json();
