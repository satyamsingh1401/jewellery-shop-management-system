$kind: http-request
name: "Refund first payment fully"
order: 28000
method: POST
url: "{{base_url}}/api/payments/{{first_payment_id}}/refund"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 400,
      "reason": "Verification full return"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test("Status is REFUNDED", () => pm.expect(data.status).to.eql("REFUNDED"));
      pm.test("refundedAmount is 400", () => pm.expect(Number(data.refundedAmount)).to.eql(400));
