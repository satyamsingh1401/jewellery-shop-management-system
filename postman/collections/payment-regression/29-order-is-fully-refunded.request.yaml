$kind: http-request
name: "Order is fully refunded"
order: 29000
method: GET
url: "{{base_url}}/api/v1/orders/id/{{order_id}}"
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{staff_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test("Order payment status is REFUNDED", () => pm.expect(data.paymentStatus).to.eql("REFUNDED"));
