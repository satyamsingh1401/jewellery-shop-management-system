$kind: http-request
name: "Denied refund leaves payment unchanged"
order: 22000
method: GET
url: "{{base_url}}/api/payments/{{second_payment_id}}"
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{staff_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test("Status is COMPLETED", () => pm.expect(data.status).to.eql("COMPLETED"));
      pm.test("refundedAmount is 0", () => pm.expect(Number(data.refundedAmount)).to.eql(0));
