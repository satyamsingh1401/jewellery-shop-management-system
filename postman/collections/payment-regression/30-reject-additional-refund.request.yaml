$kind: http-request
name: "Reject additional refund"
order: 30000
method: POST
url: "{{base_url}}/api/payments/{{first_payment_id}}/refund"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 1,
      "reason": "Already refunded"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 400", () => pm.response.to.have.status(400));
      const data = pm.response.json();
