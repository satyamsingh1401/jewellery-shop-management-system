$kind: http-request
name: "Cancel pending payment"
order: 34000
method: POST
url: "{{base_url}}/api/payments/{{cancelled_payment_id}}/cancel"
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{staff_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test("Status is CANCELLED", () => pm.expect(data.status).to.eql("CANCELLED"));
